# =========================================================================
# asr_otc_recip | LibriSpeech train_clean_100_ran_10h_worderror30 (10h, 30% word errors)
# features : frozen SSL: wav2vec2_base_960 (s3prl)
# batching : batch_bins/accum_grad 6000000/1, warmup_steps 3000 (10h subset,
#            as conf/cross_transfer/libri_ctc_ssl.yaml)
# tokens   : BPE-200   |   epochs: 30   |   CTC-only (decoder=none, ctc_weight=1.0)
# -------------------------------------------------------------------------
# METHOD: otc_recip
# OTC-RECIP -- the contribution.  Same graph as otc_token, but the
# arc weights are indexed on the MODEL'S OWN held-out entropy instead of
# on an epoch clock, so there is no epoch budget to tune against.
# The entropy block below is BYTE-IDENTICAL in all three corpora'
# otc_recip.yaml -- one parameter set, three corpora, two feature types,
# two epoch budgets.  That transfer is the paper's claim, and
# otc_recip/tests/test_config_entropy_keys.py enforces it.
# -------------------------------------------------------------------------
# Within this corpus, EVERYTHING outside the ctc_conf loss block is identical
# across the four methods (encoder, optimiser, LR schedule, specaug, batching,
# seed, keep_nbest_models, averaging).  Enforced by
# otc_recip/tests/test_config_within_corpus.py (libri_final/ only).
# =========================================================================

encoder: e_branchformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  attention_layer_type: rel_selfattn
  pos_enc_layer_type: rel_pos
  rel_pos_type: latest
  cgmlp_linear_units: 1024
  cgmlp_conv_kernel: 31
  use_linear_after_conv: false
  gate_activation: identity
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d2
  layer_drop_rate: 0.0
  linear_units: 1024
  positionwise_layer_type: linear
  use_ffn: true
  macaron_ffn: true
  merge_conv_kernel: 31
decoder: none
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  otc_granularity: token
  allow_bypass_arc: true
  allow_self_loop_arc: true
  arc_schedule: entropy_reciprocal
  entropy_mode: soft
  entropy_source: dev
  entropy_ema_alpha: 0.3
  entropy_low: 0.01
  entropy_shape_k: 1.3
  entropy_eps: 0.0001
  initial_bypass_weight: -25.0
  initial_self_loop_weight: -5.0
  bypass_end: -0.01
  self_loop_end: -0.001
  output_beam: 100.0
  use_double_scores: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: wav2vec2_base_960
  download_dir: ./hub
  multilayer_feature: true
preencoder: linear
preencoder_conf:
  input_size: 768
  output_size: 80
freeze_param:
- frontend.upstream
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 6000000
accum_grad: 1
max_epoch: 30
patience: null
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 3000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
