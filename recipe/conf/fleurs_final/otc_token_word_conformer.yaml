# =========================================================================
# asr_otc_recip | FLEURS (14 languages)
# features : frozen SSL: XLS-R 300M / xlsr2_300m.pt (s3prl)
# tokens   : char   |   epochs: 30   |   CTC-only (decoder=none, ctc_weight=1.0)
# encoder  : conformer (12 blocks, d=256, macaron, rel_pos)
# stopping : patience 5, keep_nbest_models 5 -- otherwise identical to
#            otc_word.yaml (the e_branchformer config)
# -------------------------------------------------------------------------
# METHOD: otc_token_word
# OTC-TOKEN-WORD (otc_granularity: dual) -- the otc_token graph (a bypass
# arc and a self-loop at EVERY token) PLUS one word-level bypass arc per
# word of >= 2 tokens, so a substitution can be taken token by token or as
# one wildcard for the whole word.  Separate penalties per arc kind:
#   token bypass  -25.0, decay 0.775   (as otc_token)
#   word bypass   -19.0, decay 0.925   (the tuned otc_word bypass)
#   self-loop      -5.0, decay 0.775   (as otc_token)
# star_start_epoch: 3 -- epochs 1-2 train on the plain CTC graph and every
# star arc (token bypass, word bypass, self-loop) exists from epoch 3 on;
# the decay clock starts there, w(e) = w_init * decay^(e-3).
# -------------------------------------------------------------------------
# Within this corpus, EVERYTHING outside the ctc_conf loss block is identical
# across the four methods (encoder, optimiser, LR schedule, specaug, batching,
# seed, keep_nbest_models, averaging).  Enforced by
# otc_recip/tests/test_config_within_corpus.py.
# =========================================================================

encoder: conformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d2
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: rel_pos
  selfattention_layer_type: rel_selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31
decoder: none
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  otc_granularity: dual
  allow_bypass_arc: true
  allow_self_loop_arc: true
  arc_schedule: epoch
  star_start_epoch: 3
  initial_bypass_weight: -25.0
  bypass_weight_decay: 0.775
  initial_word_bypass_weight: -19.0
  word_bypass_weight_decay: 0.925
  initial_self_loop_weight: -5.0
  self_loop_weight_decay: 0.775
  output_beam: 100.0
  use_double_scores: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: wav2vec2_url
    path_or_url: https://huggingface.co/s3prl/converted_ckpts/resolve/main/xlsr2_300m.pt
  download_dir: ./hub
  multilayer_feature: true
preencoder: linear
preencoder_conf:
  input_size: 1024
  output_size: 80
freeze_param:
- frontend.upstream
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 6000000
accum_grad: 1
max_epoch: 30
patience: 5
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 2000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
