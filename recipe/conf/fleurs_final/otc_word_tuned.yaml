# =========================================================================
# asr_otc_recip | FLEURS (14 languages)
# features : frozen SSL: XLS-R 300M / xlsr2_300m.pt (s3prl)
# tokens   : char   |   epochs: 30   |   CTC-only (decoder=none, ctc_weight=1.0)
# -------------------------------------------------------------------------
# METHOD: otc_word_tuned
# OTC-WORD with TUNED arc weights (the icefall -19 / +3.75 recipe is the
# plain otc_word config).  One <star> arc spans a WHOLE WORD; self-loops sit
# at word boundaries.  Tuned on the LibriSpeech 10h SSL cross-transfer sweep
# (self-loop-only, bypass-only, then both arcs):
#   bypass     -19.0, decay 0.925
#   self-loop   -1.0, decay 0.975
# star_start_epoch: 3 -- epochs 1-2 train on the plain CTC graph and every
# star arc exists from epoch 3 on; the decay clock starts there, so epoch 3
# uses exactly the initial weights, w(e) = w_init * decay^(e-3).  An
# untrained model sends most lattice paths through the stars, which kept
# runs from converging when the arcs were on from the first step.
# -------------------------------------------------------------------------
# Within this corpus, EVERYTHING outside the ctc_conf loss block is identical
# across the four methods (encoder, optimiser, LR schedule, specaug, batching,
# seed, keep_nbest_models, averaging).  Enforced by
# otc_recip/tests/test_config_within_corpus.py.
# =========================================================================

encoder: e_branchformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  attention_layer_type: rel_selfattn
  pos_enc_layer_type: rel_pos
  rel_pos_type: latest
  cgmlp_linear_units: 1024
  cgmlp_conv_kernel: 31
  use_linear_after_conv: false
  gate_activation: identity
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d2
  layer_drop_rate: 0.0
  linear_units: 1024
  positionwise_layer_type: linear
  use_ffn: true
  macaron_ffn: true
  merge_conv_kernel: 31
decoder: none
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  otc_granularity: word
  allow_bypass_arc: true
  allow_self_loop_arc: true
  arc_schedule: epoch
  star_start_epoch: 3
  initial_bypass_weight: -19.0
  bypass_weight_decay: 0.925
  initial_self_loop_weight: -1.0
  self_loop_weight_decay: 0.975
  output_beam: 100.0
  use_double_scores: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: wav2vec2_url
    path_or_url: https://huggingface.co/s3prl/converted_ckpts/resolve/main/xlsr2_300m.pt
  download_dir: ./hub
  multilayer_feature: true
preencoder: linear
preencoder_conf:
  input_size: 1024
  output_size: 80
freeze_param:
- frontend.upstream
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 6000000
accum_grad: 1
max_epoch: 30
patience: null
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 2000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
