# =========================================================================
# asr_otc_recip | LABEL SMOOTHING | LibriSpeech train_clean_100
# -------------------------------------------------------------------------
# CTC label smoothing, eps=0.01.  Star arcs OFF.
#     L         = (1 - eps) * L_CTC + eps * L_uniform
#     L_uniform = - mean over VALID frames of [ (1/V) * sum_v log p_t(v) ]
# V = real_odim: blank INCLUDED, the <star> column EXCLUDED.
#
# NOTE: espnet's model_conf.lsm_weight smooths the ATTENTION DECODER's
# cross-entropy and does NOT touch CTC.  There is no CTC label smoothing in
# espnet, so this is implemented in espnet2/asr/ctc_otc_recip.py and pinned
# down by otc_recip/tests/test_label_smoothing.py.
#
# This is the control for 'is OTC just doing label smoothing?'.  The only
# difference from conf/libri_final/ctc.yaml is the added eps term.
# =========================================================================

encoder: e_branchformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  attention_layer_type: rel_selfattn
  pos_enc_layer_type: rel_pos
  rel_pos_type: latest
  cgmlp_linear_units: 1024
  cgmlp_conv_kernel: 31
  use_linear_after_conv: false
  gate_activation: identity
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d2
  layer_drop_rate: 0.0
  linear_units: 1024
  positionwise_layer_type: linear
  use_ffn: true
  macaron_ffn: true
  merge_conv_kernel: 31
decoder: none
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  arc_schedule: label_smoothing
  allow_bypass_arc: false
  allow_self_loop_arc: false
  ctc_label_smoothing: 0.01
  output_beam: 100.0
  use_double_scores: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: wav2vec2_base_960
  download_dir: ./hub
  multilayer_feature: true
preencoder: linear
preencoder_conf:
  input_size: 768
  output_size: 80
freeze_param:
- frontend.upstream
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 16000000
accum_grad: 4
max_epoch: 30
patience: null
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 3000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
