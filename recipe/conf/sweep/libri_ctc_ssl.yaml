# =========================================================================
# asr_otc_recip | schedule-sensitivity sweep (Fig. 2) | LibriSpeech 10 h | ssl
# features : frozen SSL (s3prl upstream)   |   epochs: 30
# -------------------------------------------------------------------------
# METHOD: ctc
# CTC reference line for Fig. 2 -- star arcs OFF.
# Same k2 graph compiler and k2.ctc_loss call as the OTC modes, with
# allow_bypass_arc/allow_self_loop_arc false.  Nothing is swept for this
# mode: there is exactly one cell per seed.
#
# Everything outside ctc_conf is byte-identical to
# conf/sweep/libri_otc_token_ssl.yaml,
# so the three sweep modes (ctc, otc_token, otc_recip) differ only in the
# loss.  Controlled across all of them:
#   initial_bypass_weight -25.0, initial_self_loop_weight -5.0,
#   batch_bins/accum_grad 6000000/1, warmup_steps 3000.
#
# Run with:
#   ./run_ebf_otc_recip_sweep.sh --modes ctc
# =========================================================================

encoder: e_branchformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  attention_layer_type: rel_selfattn
  pos_enc_layer_type: rel_pos
  rel_pos_type: latest
  cgmlp_linear_units: 1024
  cgmlp_conv_kernel: 31
  use_linear_after_conv: false
  gate_activation: identity
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d2
  layer_drop_rate: 0.0
  linear_units: 1024
  positionwise_layer_type: linear
  use_ffn: true
  macaron_ffn: true
  merge_conv_kernel: 31
decoder: none
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  arc_schedule: none
  allow_bypass_arc: false
  allow_self_loop_arc: false
  output_beam: 100.0
  use_double_scores: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: wav2vec2_base_960
  download_dir: ./hub
  multilayer_feature: true
preencoder: linear
preencoder_conf:
  input_size: 768
  output_size: 80
freeze_param:
- frontend.upstream
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 6000000
accum_grad: 1
max_epoch: 30
patience: null
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 3000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
