# =========================================================================
# asr_otc_recip | LibriSpeech train_clean_100
# features : frozen SSL: wav2vec2_base_960 (s3prl)
# tokens   : BPE-200   |   epochs: 30   |   CTC-only (decoder=none, ctc_weight=1.0)
# encoder  : conformer (12 blocks, d=256, macaron, rel_pos)
# stopping : patience 5, keep_nbest_models 5 -- otherwise identical to
#            ctc.yaml (the e_branchformer config)
# -------------------------------------------------------------------------
# METHOD: ctc
# CTC baseline -- star arcs OFF.
# Goes through the IDENTICAL k2 graph compiler and k2.ctc_loss call as
# every OTC mode below, with allow_bypass_arc/allow_self_loop_arc set to
# false: it is the same loss with the wildcard arcs switched off, not a
# different CTC implementation.  (Verified bit-for-bit against
# espnet2/asr/ctc_k2.py in otc_recip/tests/test_parity_vs_asr_otc.py.)
# -------------------------------------------------------------------------
# Within this corpus, EVERYTHING outside the ctc_conf loss block is identical
# across the four methods (encoder, optimiser, LR schedule, specaug, batching,
# seed, keep_nbest_models, averaging).  Enforced by
# otc_recip/tests/test_config_within_corpus.py.
# =========================================================================

encoder: conformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d2
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: rel_pos
  selfattention_layer_type: rel_selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31
decoder: none
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  arc_schedule: none
  allow_bypass_arc: false
  allow_self_loop_arc: false
  output_beam: 100.0
  use_double_scores: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: wav2vec2_base_960
  download_dir: ./hub
  multilayer_feature: true
preencoder: linear
preencoder_conf:
  input_size: 768
  output_size: 80
freeze_param:
- frontend.upstream
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 16000000
accum_grad: 4
max_epoch: 30
patience: 5
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 5
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 3000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
