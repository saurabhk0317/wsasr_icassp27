# =========================================================================
# asr_otc_recip | CROSS-TRANSFER sweep | LibriSpeech | nonssl
# features : STFT filterbank, no SSL   |   epochs: 70
# -------------------------------------------------------------------------
# METHOD: otc_recip
# OTC-RECIP base for the entropy_shape_k sweep.
# entropy_shape_k below (1.2) is the shipped value and only makes the file
# runnable on its own: run_ebf_otc_recip_crosstransfer.sh overrides it per
# run with --ctc_conf entropy_shape_k=<K>.  Every other entropy parameter is
# byte-identical to conf/<corpus>_final/otc_recip.yaml, so the sweep varies
# k and nothing else.
#
# Everything outside ctc_conf is byte-identical to
# conf/cross_transfer/libri_otc_token_nonssl.yaml,
# so the three sweep modes (ctc, otc_token, otc_recip) differ only in the
# loss.  Controlled across all of them:
#   initial_bypass_weight -25.0, initial_self_loop_weight -5.0,
#   batch_bins/accum_grad 6000000/1, warmup_steps 5000.
#
# Run with:
#   ./run_ebf_otc_recip_crosstransfer.sh --corpora libri --variants nonssl --modes otc_recip
# =========================================================================

encoder: e_branchformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  attention_layer_type: rel_selfattn
  pos_enc_layer_type: rel_pos
  rel_pos_type: latest
  cgmlp_linear_units: 1024
  cgmlp_conv_kernel: 31
  use_linear_after_conv: false
  gate_activation: identity
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d
  layer_drop_rate: 0.0
  linear_units: 1024
  positionwise_layer_type: linear
  use_ffn: true
  macaron_ffn: true
  merge_conv_kernel: 31
decoder: none
model_conf:
  ctc_weight: 1.0
  report_cer: true
  report_wer: false
ctc_conf:
  otc_granularity: token
  allow_bypass_arc: true
  allow_self_loop_arc: true
  arc_schedule: entropy_reciprocal
  entropy_mode: soft
  entropy_source: dev
  entropy_ema_alpha: 0.3
  entropy_low: 0.01
  entropy_shape_k: 1.2
  entropy_eps: 0.0001
  initial_bypass_weight: -25.0
  initial_self_loop_weight: -5.0
  bypass_end: -0.01
  self_loop_end: -0.001
  output_beam: 100.0
  use_double_scores: true
frontend_conf:
  n_fft: 512
  win_length: 400
  hop_length: 160
seed: 2026
num_workers: 8
batch_type: numel
batch_bins: 6000000
accum_grad: 1
max_epoch: 70
patience: null
init: none
best_model_criterion:
- - valid
  - loss
  - min
keep_nbest_models: 10
use_amp: false
optim: adam
optim_conf:
  lr: 0.002
  weight_decay: 1.0e-06
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 5000
specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  num_time_mask: 5
